services:
  backend:
    build: ./back-end
    container_name: mixxtopia-backend
    restart: unless-stopped
    env_file:
      - ./back-end/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: mixxtopia-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - internal

  nginx:
    build: ./front-end
    container_name: mixxtopia-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 호스트의 certbot(terraform/user_data.sh.tpl, README.md 참고)이 관리하는 인증서/
      # ACME 챌린지 경로를 그대로 공유한다.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  redis-data:
