<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon_SM.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIXXTOPIA</title>
    <script>
      try {
        var theme = localStorage.getItem('mixxtopia:theme')
        if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
