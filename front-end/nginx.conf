# 80번: certbot 인증(webroot) 경로만 직접 서빙하고, 나머지는 전부 https로 보낸다.
# /etc/letsencrypt, /var/www/certbot 마운트는 docker-compose.yml의 nginx 서비스 참고.
server_tokens off;

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    # terraform/user_data.sh.tpl이 최초 부팅 시 같은 경로에 더미(자가서명) 인증서를 미리
    # 만들어둬서, 실제 Let's Encrypt 인증서를 받기 전에도 nginx가 떠 있을 수 있게 한다.
    # terraform/README.md대로 certbot을 실행하면 이 경로의 파일이 진짜 인증서로 바뀌고
    # nginx만 재시작하면 반영된다(이미지 재빌드 불필요).
    ssl_certificate     /etc/letsencrypt/live/mixxtopia.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mixxtopia.site/privkey.pem;

    # CSP는 제외: 링크 프리뷰가 임의 외부 이미지 URL을 그대로 띄우는 구조라
    # img-src를 함부로 좁히면 깨짐 — 별도로 도메인 정리 후 추가 예정.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    root /usr/share/nginx/html;
    index index.html;

    # React SPA: 모든 경로를 index.html로
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 요청은 FastAPI 컨테이너로 프록시
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
